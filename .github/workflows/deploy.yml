name: Deploy to Production

on:
  push:
    branches: [dev]   # CICD 검증 단계 — dev 에서 파이프라인 확인 후 [main] 으로 승격 예정

# 동시 배포 방지 — 이전 실행이 완료될 때까지 대기
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: self-hosted   # 오라클 A1 (arm64) self-hosted runner
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 테스트 게이트 (실패 시 배포 차단) ──────────────────────────
      - name: Test — app_server (JUnit)
        working-directory: back/app_server
        run: ./gradlew test --no-daemon -q

      - name: Test — ai_server (pytest)
        working-directory: back/ai_server
        # self-hosted VM: uv 가 pyproject 기반 venv 자동 구성 (~/.local/bin/uv, arm64)
        run: ~/.local/bin/uv run --frozen pytest tests/ -m "not integration and not eval" -q

      # ── .env.prod 자동 생성 (GitHub Secrets/Variables → 서버 파일) ──
      # deploy.sh 보다 먼저 실행: sync_workspace() rsync 가 .env.prod 를 exclude 하므로
      # 이 스텝이 먼저 파일을 써야 deploy.sh 가 그대로 사용한다 (순서: 생성 → deploy.sh).
      # 시크릿은 env: 블록으로만 주입(명령줄 인자 X, set -x 사용 X) → 로그 노출 방지.
      # 안전 상수(SPRING_PROFILES_ACTIVE, PILLMATE_DEV_FALLBACK)는 여기 하드코딩 — secret/variable 로 절대 이동 금지.
      - name: Generate .env.prod
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PILLMATE_JWT_SECRET: ${{ secrets.PILLMATE_JWT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_DSN_AI: ${{ secrets.SENTRY_DSN_AI }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PROD_HOST: ${{ vars.PROD_HOST }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          NOTIFICATION_PROVIDER: ${{ vars.PILLMATE_NOTIFICATION_PROVIDER }}
          DEPLOY_ROOT_VAR: ${{ vars.DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          DEPLOY_ROOT="${DEPLOY_ROOT_VAR:-/opt/pillmate}"
          BACK_DIR="$DEPLOY_ROOT/back"
          mkdir -p "$BACK_DIR"
          umask 077
          cat > "$BACK_DIR/.env.prod" <<EOF
          # 자동 생성 — 수동 편집 금지. 매 배포마다 이 스텝이 재생성한다.
          # 안전 상수
          SPRING_PROFILES_ACTIVE=production
          PILLMATE_DEV_FALLBACK=false
          AI_SERVER_BASE_URL=http://ai-server:8001
          APP_DEEPLINK=pillmate://oauth/kakao
          # 도메인(DuckDNS) — PROD_HOST 하나를 Caddy DOMAIN 과 카카오 redirect 양쪽에 사용(불일치 방지)
          DOMAIN=${PROD_HOST}
          ACME_EMAIL=${ACME_EMAIL}
          KAKAO_REDIRECT_URI=https://${PROD_HOST}/api/v1/auth/kakao/callback
          # 비시크릿 Variables
          AWS_REGION=${AWS_REGION:-ap-northeast-2}
          S3_BUCKET_NAME=${S3_BUCKET_NAME:-pillmate-prescriptions}
          PILLMATE_NOTIFICATION_PROVIDER=${NOTIFICATION_PROVIDER:-log}
          FIREBASE_CREDENTIALS_PATH=/run/secrets/firebase-service-account.json
          # 시크릿 — 키명은 docker-compose.prod.yml env_file 직접주입 대상과 정확히 일치해야 함
          # (KAKAO_REST_API_KEY: 로컬 back/.env 의 KAKAO_OAUTH_KEY 와 다른 이름이니 혼동 금지)
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          PILLMATE_JWT_SECRET=${PILLMATE_JWT_SECRET}
          KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
          KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          SENTRY_DSN=${SENTRY_DSN:-}
          SENTRY_DSN_AI=${SENTRY_DSN_AI:-}
          SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
          EOF
          chmod 600 "$BACK_DIR/.env.prod"
          echo "✓ .env.prod written: $(wc -l < "$BACK_DIR/.env.prod") lines, perms $(stat -c%a "$BACK_DIR/.env.prod" 2>/dev/null || stat -f%Lp "$BACK_DIR/.env.prod")"

      # ── FCM 자격증명 (PILLMATE_NOTIFICATION_PROVIDER=fcm 일 때만) ────
      - name: Write Firebase credentials (FCM only)
        if: ${{ vars.PILLMATE_NOTIFICATION_PROVIDER == 'fcm' }}
        env:
          FIREBASE_CREDENTIALS_JSON_B64: ${{ secrets.FIREBASE_CREDENTIALS_JSON_B64 }}
          DEPLOY_ROOT_VAR: ${{ vars.DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          DEPLOY_ROOT="${DEPLOY_ROOT_VAR:-/opt/pillmate}"
          BACK_DIR="$DEPLOY_ROOT/back"
          mkdir -p "$BACK_DIR/secrets"
          umask 077
          echo "$FIREBASE_CREDENTIALS_JSON_B64" | base64 -d > "$BACK_DIR/secrets/firebase-service-account.json"
          chmod 600 "$BACK_DIR/secrets/firebase-service-account.json"
          echo "✓ firebase-service-account.json written"

      # ── 무중단 배포 ────────────────────────────────────────────────
      # deploy.sh 가 workspace → /opt/pillmate/back rsync 후 blue-green 전환.
      # 시크릿은 서버 /opt/pillmate/back/.env.prod 에서만 로드 (GitHub 시크릿은 위 스텝에서만 파일로 기록).
      - name: Deploy (blue-green)
        run: bash back/scripts/deploy.sh
