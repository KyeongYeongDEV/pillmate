spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: pillmate-server

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:pillmate}
    username: ${POSTGRES_USER:pillmate}
    password: ${POSTGRES_PASSWORD:pillmate_local}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway가 DDL 관리. JPA는 검증만
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  mvc:
    async:
      request-timeout: 90s

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

---
# local / dev 환경: SEED 마이그레이션 추가 실행 (운영 배포 시 SPRING_PROFILES_ACTIVE=production 으로 이 섹션 비활성화)
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/migration-dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

server:
  port: 8080
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info

cloud:
  aws:
    region:
      static: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${S3_BUCKET_NAME:pillmate-prescriptions}
    presigned-put-ttl-minutes: 5
    presigned-get-ttl-hours: 1

ai-server:
  base-url: ${AI_SERVER_BASE_URL:http://ai-server:8001}
  timeout:
    connect-ms: 5000
    read-ms: 90000

pillmate:
  notification:
    provider: ${PILLMATE_NOTIFICATION_PROVIDER:log}
    expo:
      base-url: https://exp.host
      connect-ms: 3000
      read-ms: 5000
  auth:
    dev-fallback-enabled: ${PILLMATE_DEV_FALLBACK:false}
    jwt:
      secret: ${PILLMATE_JWT_SECRET:}
      access-ttl-days: ${PILLMATE_JWT_ACCESS_TTL_DAYS:14}

kakao:
  client-id: ${KAKAO_REST_API_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  token-url: https://kauth.kakao.com/oauth/token
  user-info-url: https://kapi.kakao.com/v2/user/me
