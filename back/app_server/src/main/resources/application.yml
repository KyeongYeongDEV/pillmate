spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: pillmate-server

  lifecycle:
    # graceful shutdown 시 in-flight 요청 drain 최대 대기 (blue-green stop 무중단). 트랜잭션 내 외부호출 없음 원칙이라 25s면 충분.
    timeout-per-shutdown-phase: 25s

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:pillmate}
    username: ${POSTGRES_USER:pillmate}
    password: ${POSTGRES_PASSWORD:pillmate_local}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway가 DDL 관리. JPA는 검증만
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  mvc:
    async:
      request-timeout: 180s

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

server:
  # SIGTERM 수신 시 새 요청 거부 + 기존 요청 drain 후 종료 (모든 프로파일 공통, 로컬 dev 안전)
  shutdown: graceful
  port: 8080
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

cloud:
  aws:
    region:
      static: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${S3_BUCKET_NAME:pillmate-prescriptions}
    presigned-put-ttl-minutes: 5
    presigned-get-ttl-hours: 1

ai-server:
  base-url: ${AI_SERVER_BASE_URL:http://ai-server:8001}
  timeout:
    connect-ms: 5000
    read-ms: 170000

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SPRING_PROFILES_ACTIVE:local}
  traces-sample-rate: 0.1
  send-default-pii: false
  # SentryExceptionResolver 를 최저 우선순위로 — @ControllerAdvice가 먼저 처리하고
  # GlobalExceptionHandler에서 5xx만 명시적 captureException 호출
  exception-resolver-order: 2147483647

pillmate:
  ratelimit:
    enabled: ${PILLMATE_RATELIMIT_ENABLED:true}
    ocr:
      daily-limit: ${PILLMATE_OCR_DAILY_LIMIT:50}
    global:
      # 전역 per-user 분당 한도 — 정상 폴링(30초=분당 2~4) 대비 넉넉. 초과 시 429
      per-minute: ${PILLMATE_GLOBAL_RPM:120}
  notification:
    provider: ${PILLMATE_NOTIFICATION_PROVIDER:log}
    expo:
      base-url: https://exp.host
      connect-ms: 3000
      read-ms: 5000
  auth:
    dev-fallback-enabled: ${PILLMATE_DEV_FALLBACK:false}
    jwt:
      secret: ${PILLMATE_JWT_SECRET:}
      access-ttl-days: ${PILLMATE_JWT_ACCESS_TTL_DAYS:14}
  # 관리 엔드포인트(약품 alias 승인 등) 허용 userId 목록(CSV). 비면 전원 차단(fail-closed)
  admin:
    user-ids: ${PILLMATE_ADMIN_USER_IDS:}

kakao:
  client-id: ${KAKAO_REST_API_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:}
  token-url: https://kauth.kakao.com/oauth/token
  user-info-url: https://kapi.kakao.com/v2/user/me

app:
  deeplink: ${APP_DEEPLINK:pillmate://oauth/kakao}

---
# production 환경: API 문서(Swagger/OpenAPI) 외부 노출 차단 (보안감사 2026-07-12)
spring:
  config:
    activate:
      on-profile: production

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
# local / dev 환경: SEED 마이그레이션 추가 실행 (운영 배포 시 SPRING_PROFILES_ACTIVE=production 으로 이 섹션 비활성화)
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/migration-dev
