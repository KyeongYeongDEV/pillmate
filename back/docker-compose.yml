name: pillmate

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pillmate-postgres
    environment:
      POSTGRES_DB: pillmate
      POSTGRES_USER: pillmate
      POSTGRES_PASSWORD: pillmate_local
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pillmate -d pillmate"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pillmate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-server:
    build:
      context: ./ai_server
      dockerfile: Dockerfile
    container_name: pillmate-ai-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pillmate
      POSTGRES_USER: pillmate
      POSTGRES_PASSWORD: pillmate_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_API_KEY1: ${GEMINI_API_KEY1:-}
      GEMINI_API_KEY2: ${GEMINI_API_KEY2:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${OpenAI_API_KEY:-}}
      OpenAI_API_KEY: ${OpenAI_API_KEY:-}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8001/healthz',timeout=2).status_code==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: ./app_server
      dockerfile: Dockerfile
    container_name: pillmate-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pillmate
      POSTGRES_USER: pillmate
      POSTGRES_PASSWORD: pillmate_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummy}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummy}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-pillmate-prescriptions}
      AI_SERVER_BASE_URL: ${AI_SERVER_BASE_URL:-http://ai-server:8001}
      PILLMATE_NOTIFICATION_PROVIDER: ${PILLMATE_NOTIFICATION_PROVIDER:-log}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      # dev-only: local compose에서만 주입. compose.prod.yml + .env.prod 는 이 값 미포함 → prod fail-closed 유지
      PILLMATE_JWT_SECRET: ${PILLMATE_JWT_SECRET:-dev-local-only-secret-not-for-production-use}
      PILLMATE_DEV_FALLBACK: ${PILLMATE_DEV_FALLBACK:-true}
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
