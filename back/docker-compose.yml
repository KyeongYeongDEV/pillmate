name: pillmate

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pillmate-postgres
    logging: *default-logging
    environment:
      POSTGRES_DB: pillmate
      POSTGRES_USER: pillmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pillmate_local}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pillmate -d pillmate"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pillmate-redis
    logging: *default-logging
    environment:
      TZ: Asia/Seoul
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-server:
    build:
      context: ./ai_server
      dockerfile: Dockerfile
    container_name: pillmate-ai-server
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pillmate
      POSTGRES_USER: pillmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pillmate_local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OCR_VISION_VARIANT: ${OCR_VISION_VARIANT:-flash}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${OpenAI_API_KEY:-}}
      OpenAI_API_KEY: ${OpenAI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN_AI:-}
      TZ: Asia/Seoul
    # 호스트 publish 하지 않음(보안) — app 은 내부 네트워크 http://ai-server:8001 로 접근.
    # 로컬 개발 시 호스트 노출은 docker-compose.override.yml(자동 로드)에서만 추가. prod 미노출.
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8001/healthz',timeout=2).status_code==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: ./app_server
      dockerfile: Dockerfile
    container_name: pillmate-app
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pillmate
      POSTGRES_USER: pillmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pillmate_local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummy}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummy}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-pillmate-prescriptions}
      AI_SERVER_BASE_URL: ${AI_SERVER_BASE_URL:-http://ai-server:8001}
      PILLMATE_NOTIFICATION_PROVIDER: ${PILLMATE_NOTIFICATION_PROVIDER:-log}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      PILLMATE_JWT_SECRET: ${PILLMATE_JWT_SECRET:-}
      PILLMATE_DEV_FALLBACK: ${PILLMATE_DEV_FALLBACK:-false}
      KAKAO_REST_API_KEY: ${KAKAO_OAUTH_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TZ: Asia/Seoul
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
