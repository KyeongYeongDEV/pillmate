[project]
name = "pillmate-ai-server"
version = "0.1.0"
description = "PillMate AI server (FastAPI + LangChain + Gemini + pgvector RAG)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langchain>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-postgres>=0.0.12",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "jamotools>=0.1.10",
    "python-Levenshtein>=0.25.1",
    "FlagEmbedding>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 실제 DB/외부 API 호출 (CTO 가 별도 실행)",
    "eval: GT 기반 평가 테스트 — 느림, CI 별도 (pytest -m eval)",
    "eval_full: GT 100건 전체 평가 (DB 연결 필수, pytest -m eval_full)",
]
